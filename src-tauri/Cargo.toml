[package]
name = "echo-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "echo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[[bench]]
name = "queue_performance"
harness = false

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.19.0"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "sync", "full"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
mlua = { version = "0.11.6", features = ["lua54", "vendored", "async", "serialize", "send"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
url = "2"
walkdir = "2.5.0"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "isomp4", "ogg", "aac", "alac", "vorbis", "pcm"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"
lazy_static = "1.4"
ringbuf = "0.3"
souvlaki = "0.7.3"
regex = "1.10"
strsim = "0.11"
stream-download = { version = "0.24.1", default-features = false, features = ["reqwest-rustls", "temp-storage"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
m3u8-rs = "6.0.1"
bytes = "1.12.1"
sha2 = "0.11.0"
